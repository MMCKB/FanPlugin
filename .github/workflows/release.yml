name: Build and Release

on:
  push:
    # 插件市场要求 Tag 严格为 a.b.c.d 形式（如 1.0.6.0），不能带 v 前缀或其它内容，
    # 否则 PluginIndex 的索引生成器认不出，插件不会出现在市场里。
    tags:
      - "[0-9]*"
  workflow_dispatch:
    inputs:
      version:
        description: "版本号（四段，如 1.0.6.0）"
        required: true
        type: string
      create_release:
        description: "编译完成后创建 Release"
        required: false
        default: true
        type: boolean

permissions:
  contents: write

jobs:
  release:
    name: 编译并发布
    runs-on: windows-latest

    steps:
      - name: 检出代码
        uses: actions/checkout@v4

      - name: 安装 .NET 8
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: "8.0.x"

      - name: 解析版本号
        id: version
        shell: pwsh
        run: |
          if ("${{ github.ref_type }}" -eq "tag") {
            # 推送标签触发：版本号来自标签；旧的 v1.x 标签也兼容一下
            $ver = "${{ github.ref_name }}".TrimStart("v", "V")
            $tag = "${{ github.ref_name }}"
            $makeRelease = "true"
          } else {
            # 手动触发：版本号来自输入
            $ver = "${{ inputs.version }}".Trim().TrimStart("v", "V")
            if ([string]::IsNullOrWhiteSpace($ver)) {
              throw "手动触发时必须填写版本号（例如 1.0.6.0）"
            }
            $tag = $null
            $makeRelease = "${{ inputs.create_release }}"
          }

          # 统一成四段版本号，避免下游解析失败
          $parts = $ver.Split(".")
          while ($parts.Count -lt 4) { $parts += "0" }
          $full = ($parts[0..3] -join ".")

          # 手动触发时用规范化的四段版本号当 Tag，满足插件市场的 a.b.c.d 要求
          if ([string]::IsNullOrWhiteSpace($tag)) { $tag = $full }

          "value=$full"          >> $env:GITHUB_OUTPUT
          "display=$ver"         >> $env:GITHUB_OUTPUT
          "tag=$tag"             >> $env:GITHUB_OUTPUT
          "release=$makeRelease" >> $env:GITHUB_OUTPUT
          Write-Host "版本号：$full / 标签：$tag / 创建 Release：$makeRelease"

      - name: 同步 manifest 版本号
        shell: pwsh
        run: |
          $manifest = "ClassIsland.FanControl/manifest.yml"
          $text = Get-Content $manifest -Raw
          $text = $text -replace "(?m)^version:.*$", "version: ${{ steps.version.outputs.value }}"
          Set-Content $manifest $text -NoNewline -Encoding utf8

      - name: 还原依赖
        run: dotnet restore ClassIsland.FanControl/ClassIsland.FanControl.csproj

      - name: 编译
        run: dotnet build ClassIsland.FanControl/ClassIsland.FanControl.csproj -c Release --no-restore -p:Version=${{ steps.version.outputs.value }}

      - name: 打包 cipx
        shell: pwsh
        run: ./ClassIsland.FanControl/pack.ps1

      - name: 计算插件包校验和
        id: pkg
        shell: pwsh
        run: |
          $file = "ClassIsland.FanControl/ClassIsland.FanControl.cipx"
          $md5 = (Get-FileHash $file -Algorithm MD5).Hash
          $json = "{`"ClassIsland.FanControl.cipx`":`"$md5`"}"
          "md5=$md5" >> $env:GITHUB_OUTPUT
          "comment=<!-- CLASSISLAND_PKG_MD5 $json -->" >> $env:GITHUB_OUTPUT
          Write-Host "MD5：$md5"

      - name: 上传构建产物
        uses: actions/upload-artifact@v4
        with:
          name: ClassIsland.FanControl-${{ steps.version.outputs.value }}
          path: ClassIsland.FanControl/ClassIsland.FanControl.cipx
          if-no-files-found: error

      - name: 创建 Release
        if: steps.version.outputs.release == 'true'
        uses: softprops/action-gh-release@v2
        with:
          name: ${{ steps.version.outputs.tag }}
          tag_name: ${{ steps.version.outputs.tag }}
          target_commitish: ${{ github.sha }}
          files: ClassIsland.FanControl/ClassIsland.FanControl.cipx
          fail_on_unmatched_files: true
          body: |
            ### 更新内容

            完整提交记录：${{ github.server_url }}/${{ github.repository }}/commits/${{ steps.version.outputs.tag }}

            <!-- ClassIsland 插件市场索引生成器会读取下面这行，勿删 -->
            ${{ steps.pkg.outputs.comment }}
